name: MoMo release

# Publishes a MoMo release when a tag like `momo-v0.9.1-momo.1` is pushed:
# builds macOS and Linux binaries, then attaches them with SHA256SUMS,
# latest.json (read by `momo update` and remote installs), and install.sh.
# The annotated tag message becomes the release notes.

on:
  push:
    tags:
      - "momo-v*"

permissions:
  contents: read

# One release at a time; never cancel a half-published release.
concurrency:
  group: momo-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  check-tag:
    name: check tag
    if: github.repository_owner == 'iiMoham'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - id: tag
        name: Check tag matches Cargo.toml
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          sys.path.insert(0, "packaging/momo")
          import release_manifest
          from pathlib import Path
          base, release = release_manifest.parse_tag(sys.argv[1])
          cargo = release_manifest.cargo_version(Path("."))
          if base != cargo:
              sys.exit(f"tag base {base} does not match Cargo.toml version {cargo}")
          print(f"release={release}")
          PY

  build:
    name: build (${{ matrix.name }})
    needs: check-tag
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: momo-linux-x86_64
            smoke: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: momo-linux-aarch64
            smoke: false
          - target: x86_64-apple-darwin
            os: macos-latest
            name: momo-macos-x86_64
            smoke: false
          - target: aarch64-apple-darwin
            os: macos-latest
            name: momo-macos-aarch64
            smoke: true
    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: "true"
      MOMO_BUILD_CHANNEL: momo
      MOMO_BUILD_ID: ${{ needs.check-tag.outputs.release }}
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: cp "target/$TARGET/release/momo" "$ASSET"

      - name: Check version identity
        if: matrix.smoke
        run: |
          expected="momo ${GITHUB_REF_NAME#momo-v}"
          actual="$("./$ASSET" --version)"
          echo "$actual"
          test "$actual" = "$expected"

      - name: Check Linux binary is static
        if: runner.os == 'Linux'
        run: |
          # musl builds are static-pie: `file` says "static-pie linked" and
          # `ldd` says "statically linked"; either proves no dynamic loader.
          report="$(file "$ASSET"; ldd "$ASSET" 2>&1 || true)"
          echo "$report"
          echo "$report" | grep -qE "statically linked|static-pie linked"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    name: publish release
    needs: [check-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload its assets
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Release notes from the tag message
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN/,$d' > notes.md
          cat notes.md

      - name: Previous manifest (keeps older releases installable on remotes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern latest.json --output previous-latest.json \
            || echo "no previous MoMo release"

      - name: Build latest.json and SHA256SUMS
        run: |
          mkdir -p dist
          cp artifacts/momo-* dist/
          python3 packaging/momo/release_manifest.py \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --assets-dir dist \
            --notes-file notes.md \
            --previous previous-latest.json \
            --out-dir dist
          cp packaging/momo/install.sh dist/install.sh
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="${GITHUB_REF_NAME#momo-v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MoMo $label" \
            --notes-file notes.md \
            --latest \
            dist/momo-linux-x86_64 dist/momo-linux-aarch64 \
            dist/momo-macos-x86_64 dist/momo-macos-aarch64 \
            dist/SHA256SUMS dist/latest.json dist/install.sh
