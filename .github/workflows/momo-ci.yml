name: MoMo CI

# Runs MoMo's test gate on main and on pull requests to it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: momo-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.repository_owner == 'iiMoham'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nextest_filter: all()
          # Same exclusion as upstream's macOS CI job.
          - os: macos-latest
            nextest_filter: not binary(live_handoff)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt, clippy

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install tools
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: just,cargo-nextest

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: momo-${{ matrix.os }}

      - name: Test gate
        env:
          NEXTEST_FILTER: ${{ matrix.nextest_filter }}
          # .config/nextest.toml: report every failing test, not just the first.
          NEXTEST_PROFILE: ci
        run: just ci "$NEXTEST_FILTER" && just fork-plugins-test

  windows-package:
    # Builds the Windows package the release publishes and installs it with
    # packaging/windows/install.ps1 and install.cmd, so a broken Windows build
    # or installer shows up before a release is tagged.
    name: windows package
    if: github.repository_owner == 'iiMoham'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: momo-windows-package

      - name: Build
        run: cargo build --locked --target $env:TARGET

      - name: Package with ConPTY
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\package_windows_conpty.ps1 `
            -MomoExe "target\$env:TARGET\debug\momo.exe" `
            -PackagePath (Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg") `
            -StageDir (Join-Path $env:RUNNER_TEMP "momo-windows-x86_64") `
            -OutputPath momo-windows-x86_64.zip

      - name: Install smoke test
        shell: pwsh
        run: .\scripts\windows_install_smoke.ps1 -ArchivePath momo-windows-x86_64.zip
