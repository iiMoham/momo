name: MoMo CI

# Runs MoMo's test gate on main and on pull requests to it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: momo-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.repository_owner == 'iiMoham'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nextest_filter: all()
          # Same exclusion as upstream's macOS CI job.
          - os: macos-latest
            nextest_filter: not binary(live_handoff)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt, clippy

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install tools
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just,cargo-nextest

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          cache-bin: false
          key: momo-${{ matrix.os }}

      - name: Test gate
        env:
          NEXTEST_FILTER: ${{ matrix.nextest_filter }}
          # .config/nextest.toml: report every failing test, not just the first.
          NEXTEST_PROFILE: ci
        run: just ci "$NEXTEST_FILTER" && just fork-plugins-test
